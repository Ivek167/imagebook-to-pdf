name: Build Windows Exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025 # Prebaceno na najnoviji Windows posluzitelj koji ima ugraden Node 22

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Postavljanje Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Koristi stabilniji i brzi Python 3.11
        cache: 'pip'

    - name: Instalacija biblioteka
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller

    - name: Pakiranje u EXE
      run: |
        pyinstaller --noconsole --onefile app.py

    - name: Podizanje gotove aplikacije
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Konverter-Knjiga
        path: dist/app.exe
