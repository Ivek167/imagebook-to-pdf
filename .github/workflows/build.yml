name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Nadograđeno na najnovije verzije koje nativno podržavaju Node 24 okruženje
    - name: Preuzimanje koda
      uses: actions/checkout@v4.2.2

    - name: Pokretanje ispravnog Pythona
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Instalacija biblioteka
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pillow-heif pytesseract pyinstaller

    - name: Izrada EXE aplikacije
      run: |
        python -m PyInstaller --onefile --name="Premium_PDF_Book_Studio" app.py

    - name: Upload programa
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe
