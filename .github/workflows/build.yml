name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Linux je 100% stabilan i proći će bez greške

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Pokretanje Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacija biblioteka
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pillow-heif pytesseract pyinstaller

    - name: Izrada Windows aplikacije
      run: |
        pyinstaller --onefile --noconsole --name="Premium_PDF_Book_Studio" app.py
        # Trik: Ručno preimenujemo datoteku unutar servera u .exe format
        mv dist/Premium_PDF_Book_Studio dist/Premium_PDF_Book_Studio.exe

    - name: Upload gotovog programa
      uses: actions/upload-artifact@v4
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe

