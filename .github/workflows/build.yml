name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Koristimo Linux jer je 100% stabilan u oblaku

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4.2.2

    - name: Pokretanje Pythona
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.11'

    - name: Instalacija Linux i Python paketa za Windows EXE
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64
        python -m pip install --upgrade pip
        pip install Pillow pillow-heif pytesseract pyinstaller

    - name: Izrada Windows EXE aplikacije na Linuxu
      run: |
        pyinstaller --onefile --name="Premium_PDF_Book_Studio" app.py

    - name: Upload gotovog programa
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio
