name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ] # Pokreće se automatski kada pošaljete kod na glavnu granu
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest # GitHub pokreće pravu Windows mašinu u oblaku

    steps:
    - name: Dohvati kod s repozitorija
      uses: actions/checkout@v4

    - name: Postavi Python okruženje
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Stabilna verzija Pythona za pakiranje

    - name: Instaliraj potrebne knjižnice
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pillow-heif pytesseract pyinstaller

    - name: Kompajliraj aplikaciju u Portable EXE
      run: |
        pyinstaller --onefile --noconsole --name="Premium_PDF_Book_Studio" app.py
      # Objašnjenje zastavica:
      # --onefile: Pakira sve u samo jednu samostalnu .exe datoteku
      # --noconsole: Skriva crni terminal u pozadini, otvara se samo čisti grafički GUI
      # --name: Definira točan naziv vaše gotove aplikacije

    - name: Pohrani gotovu aplikaciju na GitHub (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe
