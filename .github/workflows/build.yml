name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Budjenje repozitorija
      uses: actions/checkout@v4

    - name: Postavi Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacija svih potrebnih paketa
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pillow-heif pytesseract pyinstaller

    - name: Kompajliranje u Windows EXE (Zaobilazak PowerShell zabrane)
      run: |
        python -m PyInstaller --onefile --name="Premium_PDF_Book_Studio" app.py

    - name: Spremanje gotovog EXE fajla
      uses: actions/upload-artifact@v4
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe
