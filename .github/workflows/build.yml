name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Dohvati kod s repozitorija
      uses: actions/checkout@v4

    - name: Postavi Python okruženje
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instaliraj potrebne knjižnice
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Kompajliraj aplikaciju u Portable EXE (s konzolom radi provjere greške)
      run: |
        pyinstaller --onefile --name="Premium_PDF_Book_Studio" app.py

    - name: Pohrani gotovu aplikaciju na GitHub (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe
