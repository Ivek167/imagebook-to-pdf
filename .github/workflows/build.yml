name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # OVA LINIJA DONOSI GUMB NA WEB!

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Pokretanje Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacija biblioteka
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pillow-heif pytesseract pyinstaller

    - name: Izrada EXE aplikacije
      run: |
        python -m PyInstaller --onefile --noconsole --name="Premium_PDF_Book_Studio" app.py

    - name: Upload programa
      uses: actions/upload-artifact@v4
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe

