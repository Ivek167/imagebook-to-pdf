name: Build Windows Exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Postavljanje Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacija biblioteka
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pakiranje u EXE
      run: |
        pyinstaller --noconsole --onefile --collect-all ttkbootstrap app.py

    - name: Podizanje gotove aplikacije
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Konverter-Knjiga
        path: dist/app.exe
