
name: Build Premium PDF Studio EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022 # Koristimo stabilniji i fiksni Windows server

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Pokretanje provjerenog okruzenja
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Python 3.10 ima unaprijed kompajlirane pakete za Windows

    - name: Instalacija slikovnih biblioteka
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=:all: Pillow pillow-heif pytesseract pyinstaller
        # Oznaka --only-binary prisiljava server da skine gotov Windows paket umjesto da trazi C++ prevoditelj

    - name: Izrada samostalne EXE aplikacije
      run: |
        pyinstaller --onefile --noconsole --name="Premium_PDF_Book_Studio" app.py

    - name: Upload gotovog Windows programa
      uses: actions/upload-artifact@v4
      with:
        name: Premium-PDF-Book-Studio-Portable
        path: dist/Premium_PDF_Book_Studio.exe
